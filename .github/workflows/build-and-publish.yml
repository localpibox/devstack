# ═══════════════════════════════════════════════════════════
# LocalPibox Devstack — CI/CD Build & Publish
# ═══════════════════════════════════════════════════════════
# Builds on GitHub (fast connection) → publishes to GHCR
# Extensions update at runtime via pi update --extensions
#
# Triggers:
#   - Push to main (Dockerfile, support/, stack-upkeep/)
#   - Weekly cron (Monday 3am UTC) — keep image fresh
#   - Manual dispatch
#
# Actions: all latest major versions (Node.js 24 native)
#   actions/checkout@v6 · docker/build-push-action@v7
#   docker/setup-buildx-action@v4 · docker/setup-qemu-action@v4
#   docker/login-action@v4 · docker/metadata-action@v6
#   actions/upload-artifact@v7

name: Build & Publish Devstack

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'support/**'
      - 'stack-upkeep/**'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'support/**'
      - 'stack-upkeep/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      publish_latest:
        description: 'Publish as :latest tag'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/localpibox/devstack

jobs:
  build:
    name: Build devstack image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event.inputs.publish_latest != false }}
            type=schedule,pattern=weekly-%Y-%W

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: linux/amd64

  status:
    name: Build status
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed!"
            exit 1
          fi
          echo "Build complete"
