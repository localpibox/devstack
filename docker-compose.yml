# Devstack — single container with VSCodium reh-web + PI Agent MCP.
#
# Usage:
#   .devstack.sh /path/to/project    # From any directory
#   cd /path/to/project && .devstack.sh .
#
# Access:
#   Editor: http://localhost:3000?tkn=<token>
#   Chat:   Pi Code GUI (sidebar) or terminal "pi"

services:
  devstack:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
    container_name: devstack
    env_file:
      - .env
      - .env.browser
    environment:
      LEMONADE_BASE_URL: "http://127.0.0.1:13305/v1"
      OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
      DEVCONTAINER_WORKSPACE_DIR: "/home/dev/workspace"
      PI_SUPPORT_DIR: "/opt/pi-support"
      # VSCodium connection token (read from .env)
      CONNECTION_TOKEN: "${CONNECTION_TOKEN:-devsession}"
      # Editor port — VSCodium default is 8000, we use 3000 for consistency
      ED_PORT: "${ED_PORT:-3000}"
    network_mode: host  # Direct access to Lemonade on host
    userns_mode: keep-id  # UID/GID alignment for rootless Podman
    cpus: 8  # Leave headroom for host services
    volumes:
      # Workspace — project directory mounted directly at /home/dev/workspace
      # .mcp.json in workspace = project-specific MCP config
      # .pi/mcp.json = auto-generated, gitignored
      - ${WORKSPACE_DIR:-.}:/home/dev/workspace:Z,cached
      # Persistent volumes
      - pi-agent-state:/home/dev/.pi
      - devstack-npm-cache:/home/dev/.npm
      - browser-states:/browser-states

volumes:
  pi-agent-state:
  devstack-npm-cache:
  browser-states:
